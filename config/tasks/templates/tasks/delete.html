{% extends "base.html" %}
{% block title %}Delete {{ task.title }}{% endblock title %}
{% block content %}
<h2>
    Delete task "{{ task.title }}" in project "{{ project.title }}"
</h2>
<section>
<form method='post'>
    {% csrf_token %}
    <button type='submit'>
        Delete
    </button>
</form>
</section>
<section>
    <a href="{% url 'tasks:detail' task.id %}">
        Cancel
    </a>
</section>
{% endblock content %}
