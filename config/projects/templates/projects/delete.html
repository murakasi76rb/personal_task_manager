{% extends "base.html" %}
{% block title %}Delete {{project.title }}{% endblock title %}
{% block content %}
<h4>
    Are you sure you want to delete?
</h4>
<form method='post'>
    {% csrf_token %}
    <button type='submit'>
        Delete
    </button>
</form>
<a href="{% url 'projects:detail' project.id %}">
    Cancel
</a>
{% endblock content %}
